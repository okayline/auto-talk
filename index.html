<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>auto-talk</title>
<style>
  body { background: #0d1022; color: #e8e8f0; font-family: "Courier New", monospace; margin: 0; padding: 20px; }
  h1 { color: #ff8fc8; font-size: 20px; margin: 0 0 12px; }
  .pick label { display: inline-block; margin: 4px 10px 4px 0; cursor: pointer; }
  .clock { font-size: 18px; color: #ff8fc8; margin-left: 4px; }
  .note { color: #8890b0; font-size: 12px; }
  .town { margin: 20px 0 8px; max-width: 620px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .side { font-size: 11px; color: #8890b0; margin: 4px 0; }
  .house { height: 120px; background: #1d2742; border: 2px solid #3a4670; position: relative; text-align: center; }
  .house.across { border-color: #2c3456; }
  .house.asleep { background: #111528; }
  .window { width: 34px; height: 26px; margin: 16px auto 6px; border: 2px solid #3a4670; background: #111528; position: relative; }
  .house.in .window { background: #f5d77a; }
  .house.in .window .head { display: block; }
  .window .head { display: none; position: absolute; left: 5px; top: 3px; width: 20px; height: 20px; }
  .label { font-size: 12px; }
  .road { margin: 10px 0; background: #161b33; border-top: 2px solid #3a4670; border-bottom: 2px solid #3a4670; height: 120px; position: relative; overflow: visible; }
  .centre { position: absolute; left: 0; right: 0; top: 59px; height: 2px; background-image: repeating-linear-gradient(90deg, #ff8fc8 0 18px, transparent 18px 36px); }
  .walker { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; transition: left 4.5s ease-in-out, top 4.5s ease-in-out; }
  .head { border-radius: 50%; position: relative; }
  .walker .head { width: 36px; height: 36px; }
  .head.ringed::after { content: ""; position: absolute; left: -22%; top: 40%; width: 144%; height: 18%; border: 2px solid #cbbf8a; border-radius: 50%; }
  .head.tilted { transform: rotate(90deg); }
  .bubble { position: absolute; top: -20px; left: 22px; white-space: nowrap; background: #fff; color: #222; border-radius: 12px; padding: 0 7px; font-size: 16px; }
</style>
</head>
<body>
<h1>auto-talk <span class="clock" id="clock"></span></h1>
<div class="note">Pick 5 of the 10 neighbours for your side. The street runs on your clock: neighbours sleep, stay in, or wander the road and meet.</div>
<div class="pick" id="pick"></div>
<div class="town">
  <div class="side">across the street</div>
  <div class="row" id="across"></div>
  <div class="road" id="road"><div class="centre"></div></div>
  <div class="row" id="mine"></div>
  <div class="side">your side</div>
</div>
<div class="note" id="msg"></div>

<script type="module">
import { PLANETS, streetHour, seeded } from './sim.js';

const KEY = 'auto-talk';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
let mine = Array.isArray(saved.residents) && saved.residents.length === 5 ? saved.residents : ['saturn', 'uranus', 'earth', 'neptune', 'jupiter'];
const ids = Object.keys(PLANETS);
const others = () => ids.filter((id) => !mine.includes(id));

const pick = document.getElementById('pick');
for (const [id, p] of Object.entries(PLANETS)) {
  const l = document.createElement('label');
  l.innerHTML = `<input type="checkbox" value="${id}"> ${p.name} (${p.type})`;
  pick.append(l);
}
const boxes = [...pick.querySelectorAll('input')];
const syncBoxes = () => { for (const b of boxes) { b.checked = mine.includes(b.value); b.disabled = !b.checked && mine.length >= 5; } };
pick.addEventListener('change', () => {
  mine = boxes.filter((b) => b.checked).map((b) => b.value);
  if (mine.length === 5) { try { localStorage.setItem(KEY, JSON.stringify({ residents: mine })); } catch {} }
  syncBoxes(); draw();
});

const head = (id) => `<div class="head${id === 'saturn' ? ' ringed' : ''}${id === 'uranus' ? ' tilted' : ''}" style="background:${PLANETS[id].color}"></div>`;
const hhmm = (h, m) => `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
const WORD = { asleep: 'asleep 💤', in: 'home', out: 'out' };

// Bubbles. While two talk (their meeting minute): speech bubbles back and forth, then how it ended for the last
// 20 seconds. Animal Crossing villagers show symbols over their heads while they talk; the exact sequence is ours.
// Anyone else out on the road now and then shows a small emote (ours: Animal Crossing villagers emote on their own,
// the set and how often are ours).
const TALK = ['💬', '…', '💬', '❗', '💬', '❓', '💬', '…'];
const IDLE = ['♪', '❗', '❓', '💭', '♪'];

const road = document.getElementById('road');
const walkers = {};
function walker(id) {
  if (!walkers[id]) {
    const w = document.createElement('div');
    w.className = 'walker';
    w.innerHTML = head(id) + '<div class="bubble"></div>';
    road.append(w);
    walkers[id] = w;
  }
  return walkers[id];
}

function draw() {
  const now = new Date();
  const date = now.toLocaleDateString('en-CA'), h = now.getHours(), m = now.getMinutes(), sec = now.getSeconds();
  const slot = Math.floor(sec / 5); // a new wander step and bubble every 5 seconds
  document.getElementById('clock').textContent = hhmm(h, m);
  document.getElementById('msg').textContent = mine.length === 5 ? '' : 'Pick 5 neighbours for your side.';
  if (mine.length !== 5) return;

  const street = streetHour(ids, date, h, m);
  const meeting = street.meetings.find((x) => x.minute === m);

  const fill = (rowId, list, across) => {
    const row = document.getElementById(rowId);
    row.innerHTML = '';
    for (const id of list) {
      const where = street.where[id];
      const house = document.createElement('div');
      house.className = `house ${where}${across ? ' across' : ''}`;
      house.innerHTML = `<div class="window">${head(id)}</div><div class="label">${PLANETS[id].name}<br>${PLANETS[id].type}<br>${WORD[where]}</div>`;
      row.append(house);
    }
  };
  fill('across', others(), true);
  fill('mine', mine, false);

  // Out on the road: the road is a grid of spots, one neighbour per spot, so nobody piles up. Every 5 seconds each
  // wanderer walks to a different free spot; a meeting pair hold two spots side by side for their minute.
  const W = road.clientWidth, H = road.clientHeight, COLS = 10, ROWS = 3;
  const spotXY = (c, r) => [(c + 0.5) * W / COLS, (r + 0.5) * H / ROWS];
  const taken = new Set();
  let meetCell;
  if (meeting) {
    const r = seeded(`${date}|${h}|${m}|spot`);
    meetCell = [Math.floor(r() * (COLS - 1)), Math.floor(r() * ROWS)];
    taken.add(meetCell.join()); taken.add([meetCell[0] + 1, meetCell[1]].join());
  }
  const free = [];
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) if (!taken.has(c + ',' + r)) free.push([c, r]);
  const shuffle = seeded(`${date}|${h}|${m}|${slot}|walk`);
  for (let i = free.length - 1; i > 0; i--) { const j = Math.floor(shuffle() * (i + 1)); [free[i], free[j]] = [free[j], free[i]]; }
  let next = 0;
  for (const id of ids) {
    const w = walker(id);
    if (street.where[id] !== 'out') { w.style.display = 'none'; continue; }
    w.style.display = '';
    const bubble = w.querySelector('.bubble');
    let x, y, text = '';
    if (meeting && (id === meeting.a || id === meeting.b)) {
      [x, y] = spotXY(meetCell[0] + (id === meeting.a ? 0 : 1), meetCell[1]);
      if (sec >= 40) text = meeting.emote;
      else if ((slot % 2 === 0) === (id === meeting.a)) text = TALK[(slot + m) % TALK.length];
    } else {
      const r = seeded(`${date}|${h}|${m}|${slot}|${id}`);
      [x, y] = spotXY(...free[next++]);
      if (r() < 0.12) text = IDLE[Math.floor(r() * IDLE.length)];
    }
    w.style.left = x + 'px'; w.style.top = y + 'px';
    bubble.textContent = text;
    bubble.style.display = text ? '' : 'none';
  }
}

syncBoxes(); draw();
setInterval(draw, 5000);
</script>
</body>
</html>
