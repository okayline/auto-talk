<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>auto-talk</title>
<style>
  body { background: #0d1022; color: #e8e8f0; font-family: "Courier New", monospace; margin: 0; padding: 20px; }
  h1 { color: #ff8fc8; font-size: 20px; margin: 0 0 12px; }
  .pick label { display: inline-block; margin: 4px 10px 4px 0; cursor: pointer; }
  .clock { font-size: 18px; color: #ff8fc8; margin-left: 4px; }
  .note { color: #8890b0; font-size: 12px; }
  .town { margin: 20px 0 8px; max-width: 620px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .side { font-size: 11px; color: #8890b0; margin: 4px 0; }
  .house { height: 120px; background: #1d2742; border: 2px solid #3a4670; position: relative; text-align: center; }
  .house.across { border-color: #2c3456; }
  .house.asleep { background: #111528; }
  .window { width: 34px; height: 26px; margin: 16px auto 6px; border: 2px solid #3a4670; background: #111528; position: relative; }
  .house.in .window { background: #f5d77a; }
  .house.in .window .head { display: block; }
  .window .head { display: none; position: absolute; left: 5px; top: 3px; width: 20px; height: 20px; }
  .label { font-size: 12px; }
  .road { margin: 10px 0; background: #161b33; border-top: 2px solid #3a4670; border-bottom: 2px solid #3a4670; padding: 6px 0; }
  .lane { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; height: 46px; }
  .centre { height: 2px; background-image: repeating-linear-gradient(90deg, #ff8fc8 0 18px, transparent 18px 36px); margin: 4px 0; }
  .spot { position: relative; display: flex; justify-content: center; align-items: center; }
  .head { border-radius: 50%; position: relative; }
  .spot .head { width: 36px; height: 36px; }
  .head.ringed::after { content: ""; position: absolute; left: -22%; top: 40%; width: 144%; height: 18%; border: 2px solid #cbbf8a; border-radius: 50%; }
  .head.tilted { transform: rotate(90deg); }
  .bubble { position: absolute; top: -14px; right: 6px; background: #fff; color: #222; border-radius: 12px; padding: 0 7px; font-size: 16px; }
  .log { margin-top: 14px; line-height: 1.6; max-width: 620px; }
  .log .clash { color: #ff8fc8; }
  .log .time { color: #8890b0; }
</style>
</head>
<body>
<h1>auto-talk <span class="clock" id="clock"></span></h1>
<div class="note">Pick 5 of the 10 neighbours for your side. The street runs on your clock: neighbours sleep, stay in, or wander the road and meet.</div>
<div class="pick" id="pick"></div>
<div class="town">
  <div class="side">across the street</div>
  <div class="row" id="across"></div>
  <div class="road">
    <div class="lane" id="laneAcross"></div>
    <div class="centre"></div>
    <div class="lane" id="laneMine"></div>
  </div>
  <div class="row" id="mine"></div>
  <div class="side">your side</div>
</div>
<div class="log" id="log"></div>

<script type="module">
import { PLANETS, streetHour } from './sim.js';

const KEY = 'auto-talk';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
let mine = Array.isArray(saved.residents) && saved.residents.length === 5 ? saved.residents : ['saturn', 'uranus', 'earth', 'neptune', 'jupiter'];
const ids = Object.keys(PLANETS);
const others = () => ids.filter((id) => !mine.includes(id));

const pick = document.getElementById('pick');
for (const [id, p] of Object.entries(PLANETS)) {
  const l = document.createElement('label');
  l.innerHTML = `<input type="checkbox" value="${id}"> ${p.name} (${p.type})`;
  pick.append(l);
}
const boxes = [...pick.querySelectorAll('input')];
const syncBoxes = () => { for (const b of boxes) { b.checked = mine.includes(b.value); b.disabled = !b.checked && mine.length >= 5; } };
pick.addEventListener('change', () => {
  mine = boxes.filter((b) => b.checked).map((b) => b.value);
  if (mine.length === 5) { try { localStorage.setItem(KEY, JSON.stringify({ residents: mine })); } catch {} }
  syncBoxes(); draw();
});

const head = (id) => `<div class="head${id === 'saturn' ? ' ringed' : ''}${id === 'uranus' ? ' tilted' : ''}" style="background:${PLANETS[id].color}"></div>`;
const hhmm = (h, m) => `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
const WORD = { asleep: 'asleep 💤', in: 'home', out: 'out' };

function draw() {
  const now = new Date();
  const date = now.toLocaleDateString('en-CA'), h = now.getHours(), m = now.getMinutes();
  document.getElementById('clock').textContent = hhmm(h, m);
  if (mine.length !== 5) { document.getElementById('log').textContent = 'Pick 5 neighbours for your side.'; return; }

  const street = streetHour(ids, date, h, m);
  const talking = street.meetings.filter((x) => x.minute === m); // the meeting happening this minute, if any
  const bubbleFor = {};
  for (const x of talking) { bubbleFor[x.a] = x.emote; bubbleFor[x.b] = x.emote; }

  const fill = (rowId, laneId, list, across) => {
    const row = document.getElementById(rowId), lane = document.getElementById(laneId);
    row.innerHTML = ''; lane.innerHTML = '';
    for (const id of list) {
      const where = street.where[id];
      const sulk = street.sulking.includes(id) && where === 'in';
      const house = document.createElement('div');
      house.className = `house ${where}${across ? ' across' : ''}`;
      house.innerHTML = `<div class="window">${head(id)}</div><div class="label">${PLANETS[id].name}<br>${PLANETS[id].type}<br>${sulk ? 'thinking…' : WORD[where]}</div>`;
      row.append(house);
      const spot = document.createElement('div');
      spot.className = 'spot';
      if (where === 'out') spot.innerHTML = head(id) + (bubbleFor[id] ? `<div class="bubble">${bubbleFor[id]}</div>` : '');
      lane.append(spot);
    }
  };
  fill('across', 'laneAcross', others(), true);
  fill('mine', 'laneMine', mine, false);

  const log = document.getElementById('log');
  const recent = street.meetings.slice(-8).reverse();
  log.innerHTML = recent.length ? '' : 'Nobody has met yet this hour.';
  for (const x of recent) {
    const line = document.createElement('div');
    line.className = x.score === 1 ? 'clash' : '';
    line.innerHTML = `<span class="time">${hhmm(h, x.minute)}</span> ${x.emote} ${PLANETS[x.a].name} and ${PLANETS[x.b].name} ${x.reason} (${PLANETS[x.a].type} + ${PLANETS[x.b].type} = ${x.score})`
      + (x.sulks ? `. ${PLANETS[x.sulks].name} goes home to think.` : '');
    log.append(line);
  }
}

syncBoxes(); draw();
setInterval(draw, 10000);
</script>
</body>
</html>
